server {
    # 8080 rather than 80, and on all interfaces so the container is reachable.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: anything unresolved falls back to the entry document.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
